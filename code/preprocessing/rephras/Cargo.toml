[package]
name = "caliper_paraphrase_generation"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "generate_11_paraphrases"
path = "generate_11_paraphrases.rs"

[[bin]]
name = "generate_paraphrases_skipfail"
path = "generate_paraphrases_skipfail.rs"

[[bin]]
name = "generate_paraphrases_modelchoice"
path = "generate_buildup/generate_paraphrases_modelchoice.rs"

[[bin]]
name = "gsm8k_paraphrases"
path = "generate_buildup/gsm8k_paraphrases.rs"

[[bin]]
name = "mmlu_paraphrases"
path = "generate_buildup/mmlu_paraphrases.rs"

[[bin]]
name = "add_scenarios"
path = "add_scenarios.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
governor = "0.4"
indicatif = "0.17"
log = "0.4"
phf = { version = "0.11", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tiktoken-rs = "0.1"
time = { version = "=0.3.36", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
