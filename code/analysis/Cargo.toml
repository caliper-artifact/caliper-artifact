[package]
name = "caliper_analysis"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "check_json"
path = "src/check_json.rs"

[[bin]]
name = "check_scores"
path = "src/check_scores.rs"

[[bin]]
name = "compose_top_occurences"
path = "src/compose_top_occurences.rs"

[[bin]]
name = "compose_top_occurences_across_metrics"
path = "src/compose_top_occurences_across_metrics.rs"

[[bin]]
name = "compose_top_prompts"
path = "src/compose_top_prompts.rs"

[[bin]]
name = "equi_patterns"
path = "src/equi_patterns.rs"

[[bin]]
name = "equi_score_patterns"
path = "src/equi_score_patterns.rs"

[[bin]]
name = "move_json_key"
path = "src/move_json_key.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.1"
env_logger = "0.11"
indicatif = "0.17"
itertools = "0.14.0"
log = "0.4"
once_cell = "1"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend"] }
png = "0.17"
rand = "0.8"
regex = "1.11.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
statrs = "0.16"
time = "=0.3.36"
tokio = { version = "1", features = ["full"] }
